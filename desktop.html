<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

    <script src="desktop.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div id="loading-screen">
            <span id="dot1">.</span><span id="dot2">.</span><span id="dot3">.</span>loading
        </div>

        <div id="lock-screen">
            <div id="avatar-parent">
                <div id="avatar">
                    <img src="assets/icons/pfp.jpg">
                    <p id="welcomeText">Welcome Adhira!</p>
                </div>
                <button id="signInBtn">Sign In -></button>
            </div>

        </div>

        <div class="desktop-icons">
            <div class="desktop-icon" id="myProjects">
                <img src="assets/icons/projects.jpg" height="64px" width="64px">
                <p class="app-name">My Projects</p>
            </div>
            <div class="desktop-icon" id="myComputer">
                <img src="assets/icons/home.jpg" height="64px" width="64px">
                <p class="app-name">My Computer</p>
            </div>
            <div class="desktop-icon" id="aboutMe">
                <img src="assets/icons/about.jpg" height="64px" width="64px">
                <p class="app-name">About Me</p>
            </div>
            <div class="desktop-icon" id="contactMe">
                <img src="assets/icons/contact.jpg" height="70px" width="70px">
                <p class="app-name">Mail</p>
            </div>
        </div>

        <div id="homePage">
            <div class="buttonBar-h">
                <div>
                    <button class="maximizeBtn">.</button>
                    <button class="closeBtn">.</button>
                </div>
                <p><img src="assets/icons/home.jpg" height="25px" width="25px">My Computer</p>
            </div>
            <div class="searchBar">
                <div class="backButton" disabled>←</div>
                <div class="address">User/desktop/My Computer</div>
            </div>
            <div class="container-h">
                <div class="navBar"> <img src="assets/icons/home.jpg" height="64px" width="64px">
                    <p id="numberOfIcon-h"></p>
                </div>
                <div class="infoTab-h"> <img src="assets/icons/file.jpg" height="64px" width="64px"><img
                        src="assets/icons/file.jpg" height="64px" width="64px"><img src="assets/icons/file.jpg"
                        height="64px" width="64px"></div>
            </div>
        </div>


        <div id="aboutPage">
            <div class="buttonBar-a">
                <div>
                    <button class="maximizeBtn">.</button>
                    <button class="closeBtn">.</button>
                </div>
                <p><img src="assets/icons/about.jpg" height="25px" width="25px">About Me</p>
            </div>
            <div class="searchBar">
                <div class="backButton" disabled>←</div>
                <div class="address">User/desktop/About Me</div>
            </div>
            <div class="container-a">
                <div class="navBar"> <img src="assets/icons/about.jpg" height="64px" width="64px">
                    <p id="numberOfIcon-a"></p>
                </div>
                <div class="infoTab-a"> <img src="assets/icons/file.jpg" height="64px" width="64px"><img
                        src="assets/icons/file.jpg" height="64px" width="64px"><img src="assets/icons/file.jpg"
                        height="64px" width="64px"></div>
            </div>
        </div>


    </main>

    <footer>
        <div class="taskbar">
            <button id="startBtn">
                <img src="assets/icons/startBtn.png" height="45px" width="45px">
            </button>

            <div class="showInTaskBar">
                
            </div>


            <div id="sideInfo">

            </div>


        </div>
    </footer>
</body>

</html>
